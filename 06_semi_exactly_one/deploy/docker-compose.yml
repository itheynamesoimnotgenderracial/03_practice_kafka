version: '3.9'
services:
  kafka1:
    image: apache/kafka:4.1.0
    container_name: kafka1

    ports:
      - "9092:9092"
      - "9093:9093"

    environment:
      CLUSTER_ID: 'lPd-xkApSeekUAEwWOk39A'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_UNSTABLE_API_VERSION_ENABLE: "true"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_SHARE_GROUP_PROTOCOL_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6

      # For Exactly-Once Semantics
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - simple-semi-eos-net

    volumes:
      - ./seos-kafka1-storage:/tmp/kafka-logs
  
  kafka2:
    image: apache/kafka:4.1.0
    container_name: kafka2
    depends_on:
      kafka1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    ports:
      - "9094:9092"

    environment:
      CLUSTER_ID: 'lPd-xkApSeekUAEwWOk39A'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka2:29092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_UNSTABLE_API_VERSION_ENABLE: "true"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_SHARE_GROUP_PROTOCOL_ENABLE: "true"

      # For exactly-once semantics 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000

    networks:
      - simple-semi-eos-net

    volumes:
      - ./seos-kafka2-storage:/tmp/kafka-logs

  kafka3:
    image: apache/kafka:4.1.0
    container_name: kafka3
    depends_on:
      kafka1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    ports:
      - "9095:9092"

    environment:
      CLUSTER_ID: 'lPd-xkApSeekUAEwWOk39A'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka3:29092,EXTERNAL://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_UNSTABLE_API_VERSION_ENABLE: "true"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_SHARE_GROUP_PROTOCOL_ENABLE: "true"

      # For Exactly-Once Semantics
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000

    networks:
      - simple-semi-eos-net

    volumes:
      - ./seos-kafka3-storage:/tmp/kafka-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pro-kafka-ui
    
    ports:
      - "8089:8080"

    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

    networks:
      - simple-semi-eos-net

    environment:
      KAFKA_CLUSTERS_0_NAME: "multi-node_cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: true

  schema-registry:
    image: confluentinc/cp-schema-registry
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - simple-semi-eos-net

    volumes:
      - ./kafka-storage:/tmp-kafka-logs

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: api-service
    ports:
      - "8084:8084"
    environment:
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/customerdb?sslmode=disable
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    # condition: service_healthy waits for the healthcheck to pass,
    # not just for the container to start. This means Kafka is actually
    # ready to accept connections before your API tries to connect.
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - simple-semi-eos-net

  postgres:
    container_name: postgres
    image: postgres:12-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - ../app.env
    ports:
      - "5432:5432"
    networks:
      - simple-semi-eos-net
    volumes:
      - data-volume:/var/lib/postgresql/data
      - ./init-customerdb.sql:/docker-entrypoint-initdb.d/init-customerdb.sql

  pgadmin_service:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: test@test.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "15432:80"
    networks:
      - simple-semi-eos-net
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres

networks:
  simple-semi-eos-net:
    driver: bridge

volumes:
  kafka-logs:
  data-volume:
  pgadmin-data:
  kafka-storage:
    driver: local