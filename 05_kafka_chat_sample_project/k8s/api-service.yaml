apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
type: Opaque
data:
  brokers: a2Fma2ExOjI5MDkyLGthZmthMjoyOTA5MixrYWZrYTM6MjkwOTI=
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
data:
  uri: bW9uZ29kYjovL21vbmdvOjI3MDE3
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
data:
  paseto-key: "QXN1cGVyLXNlY3JldC0zMi1jaGFyLW1pbmltdW0ta2V5"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: api-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: cyrile26/simple-chat-api-service:v1
          ports:
            - containerPort: 8083
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: brokers
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: uri
            - name: PASETO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: paseto-key
            - name: REDIS_ADDR
              value: redis-service:6379
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry:8081
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api-service
  ports:
    - port: 8083
      targetPort: 8083