version: '3.9'
services:
  kafka1:
    image: apache/kafka:4.1.0
    container_name: kafka1

    ports:
      - "9092:9092"
      - "9093:9093"

    environment:
      CLUSTER_ID: 'e0XlUTlhQQWjBYrkJsXVng'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_UNSTABLE_API_VERSION_ENABLE: "true"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_SHARE_GROUP_PROTOCOL_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6

      # For Exactly-Once Semantics
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000


    networks:
      - kafka-net
      
    volumes:
      - ./kafka1-storage:/tmp/kafka-logs

  kafka2:
    image: apache/kafka:4.1.0
    container_name: kafka2

    ports:
      - "9094:9092"

    environment:
      CLUSTER_ID: 'e0XlUTlhQQWjBYrkJsXVng'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka2:29092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_UNSTABLE_API_VERSION_ENABLE: "true"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_SHARE_GROUP_PROTOCOL_ENABLE: "true"
      
      # For Exactly-Once Semantics
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000


    networks:
      - kafka-net
      
    volumes:
      - ./kafka2-storage:/tmp/kafka-logs

    depends_on:
      - kafka1

  kafka3:
    image: apache/kafka:4.1.0
    container_name: kafka3

    ports:
      - "9095:9092"

    environment:
      CLUSTER_ID: 'e0XlUTlhQQWjBYrkJsXVng'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka3:29092,EXTERNAL://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_UNSTABLE_API_VERSION_ENABLE: "true"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_SHARE_GROUP_PROTOCOL_ENABLE: "true"
      
      # For Exactly-Once Semantics
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000

    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    #   interval: 10s
    #   retries: 5
    #   start_period: 30s
    #   timeout: 10s
    networks:
      - kafka-net  
    volumes:
      - ./kafka3-storage:/tmp/kafka-logs
    
    depends_on:
      - kafka1
  
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: api-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_TOPIC: raw-user-events
      REDIS_ADDR: redis:6379
      PASETO_SECRET_KEY: "super-secret-32-char-minimum-key!!"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-net

  processor:
    container_name: processor
    build:
      context: ..
      dockerfile: docker/processor.Dockerfile
    environment:
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      MONGO_URI: mongodb://mongo:27017
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-net

  service-aggregator:
    container_name: service-aggregator
    build:
      context: ..
      dockerfile: docker/aggregator.Dockerfile
    environment:
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      MONGO_URI: mongodb://mongo:27017
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_ADDR: redis:6379
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - mongo
    networks:
      - kafka-net
  
  service-leaderboard:
    container_name: leaderboard
    build:
      context: ..
      dockerfile: docker/leaderbord.Dockerfile
    environment:
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - mongo
      - redis
    # ports:
    #   - "8084:8084"
    networks:
      - kafka-net
  
  service-leaderboard2:
    container_name: leaderboard2
    build:
      context: ..
      dockerfile: docker/leaderbord.Dockerfile
    environment:
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - mongo
      - redis
    # ports:
    #   - "8084:8084"
    networks:
      - kafka-net

  timeline-processor:
    container_name: timeline-processor
    build:
      context: ..
      dockerfile: docker/timeline-processor.Dockerfile
    environment:
      KAFKA_BROKERS: kafka1:29092,kafka2:29092,kafka3:29092
      MONGO_URI: mongodb://mongo:27017
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - mongo
      - schema-registry
    networks:
      - kafka-net

  dlt-monitor:
    build:
      context: ..
      dockerfile: docker/dlt-monitor.Dockerfile
    container_name: dlt-monitor
    environment:
      KAFKA_BROKERS: kafka1:29092
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - mongo
    networks:
      - kafka-net
    restart: unless-stopped

  retry-consumer:
    container_name: retry-consumer
    build:
      context: ..
      dockerfile: docker/retry-consumer.Dockerfile
    environment:
      KAFKA_BROKERS: kafka1:29092
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-net
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - service-leaderboard
      - service-leaderboard2
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pro-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka1
      - kafka2
      - kafka3

    networks:
      - kafka-net

    environment:
      KAFKA_CLUSTERS_0_NAME: "multi-node-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: true
      
  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "7070:8080"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
  
    networks:
      - kafka-net

    environment:
      KAFKA_BROKERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      SCHEMAREGISTRY_ENABLED: true
      SCHEMAREGISTRY_URLS: http://schema-registry:8081

  schema-registry:
    image: confluentinc/cp-schema-registry
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
  
    networks:
      - kafka-net

    volumes:
      - ./kafka-storage:/tmp-kafka-logs

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka1:29092, kafka2:29092, kafka3:29092
  
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - kafka-net
    volumes:
      - mongo-data:/data/db
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8082:8081"
    depends_on:
      - mongo
    networks:
      - kafka-net
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
    
volumes:
  kafka-logs:
    driver: local
  mongo-data:
    driver: local
  redis_data:
